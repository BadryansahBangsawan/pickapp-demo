name: pickup
description: "Pick Up - On-demand service app (ride, food, send)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.2.2
  flutter_riverpod: ^3.3.1

  # Network
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0

  # UI
  shadcn_ui: ^0.54.0
  flutter_form_builder: ^10.3.0+2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  flutter_svg: ^2.2.4
  fl_chart: ^1.2.0
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^1.2.0
  google_fonts: ^6.3.2
  slide_to_act: ^2.0.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.0
  permission_handler: ^11.3.0

  # Icons
  iconsax_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
